services:
  - type: web
    name: nudo-backend
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_ORIGIN
        value: https://sotonicolasjnsn.github.io
