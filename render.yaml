services:
  - type: web
    name: nudo-botica
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_ORIGIN
        value: https://sotonicolasjnsn.github.io
      - key: CATALOG_SOURCE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
