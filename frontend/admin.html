<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración | NUDO</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css">
  <script defer src="app-config.js?v=20261116-api"></script><script defer src="admin.js?v=20261124-simplificado"></script>
</head>
<body>
<main class="container admin">
  <p><a href="./">← Volver a la tienda</a></p>
  <p class="eyebrow">NUDO / GESTIÓN</p><h1>Administración de productos y proveedores</h1>
  <p>Gestiona el catálogo de la base conectada. La sesión dura una hora.</p>
  <p id="admin-status" class="admin-status" role="status" aria-live="polite">Sin sesión.</p>
  <form id="login" class="admin-login">
    <label for="password">Contraseña de administración</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button>Iniciar sesión</button>
  </form>
  <section id="panel" hidden aria-label="Editor de productos">
    <div class="admin-actions"><button type="button" id="new">Nuevo producto</button><button class="secondary" type="button" id="refresh">Actualizar lista</button><button class="secondary" type="button" id="logout">Cerrar sesión</button></div>
    <section aria-labelledby="suppliers-title">
      <h2 id="suppliers-title">Proveedores</h2>
      <p>Consulta los proveedores y agrega uno nuevo por nombre.</p>
      <ul id="supplier-list"></ul>
      <label for="supplier-to-delete">Selecciona un proveedor para eliminar</label>
      <select id="supplier-to-delete"></select>
      <button type="button" id="delete-supplier" class="secondary">Eliminar proveedor</button>
      <form id="supplier-form" class="admin-login">
        <label for="supplier-name">Nombre del proveedor</label>
        <input id="supplier-name" name="name" required maxlength="120">
        <button type="submit">Agregar proveedor</button>
      </form>
    </section>
    <h2>Productos</h2>
    <label for="products">Selecciona un producto</label><select id="products"></select>
    <form id="editor">
      <h2>Datos del producto</h2>
      <div class="fields">
        <div class="field wide"><label for="supplier">Proveedor</label><select id="supplier" name="supplier" required></select></div>
        <div class="field"><label for="product-name">Nombre</label><input id="product-name" name="name" required maxlength="500"></div>
        <div class="field"><label for="product-category">Categoría</label><select id="product-category" name="category" required><option value="">Selecciona una categoría</option><option value="Paquete de 12">Paquete de 12</option><option value="Paquete de 24">Paquete de 24</option></select></div>
        <div class="field"><label for="product-size">Presentación</label><input id="product-size" name="size" placeholder="250 ml" required maxlength="500"></div>
        <div class="field"><label for="product-price">Precio en dólares</label><input id="product-price" name="price" type="number" min="0" max="100000" step="0.01" placeholder="12.50" required></div>
        <div class="field wide"><label for="product-description">Descripción</label><textarea id="product-description" name="description" rows="3" required maxlength="500"></textarea></div>
        <div class="field wide"><label for="product-benefits">Beneficios, uno por línea</label><textarea id="product-benefits" name="benefits" rows="3"></textarea></div>
        <div class="field wide"><label for="product-collections">Colecciones, separadas por comas</label><input id="product-collections" name="collections" placeholder="diario, shampoos"></div>
      </div>
      <div class="admin-actions"><button type="submit">Guardar producto</button><button class="secondary" type="button" id="delete">Eliminar producto</button></div>
    </form>
  </section>
</main>
</body>
</html>
